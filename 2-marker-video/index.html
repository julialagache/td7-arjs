<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TD7 - AR Marker + Video</title>
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script>
    // Lance la vidéo quand le marqueur est détecté, la met en pause quand il disparaît
    AFRAME.registerComponent('video-on-marker', {
      init: function () {
        const video = document.querySelector('#vid');
        this.el.addEventListener('markerFound', () => { video.play(); });
        this.el.addEventListener('markerLost', () => { video.pause(); });
      }
    });
    // Sur mobile, la lecture vidéo exige un premier toucher de l'utilisateur
    window.addEventListener('click', () => {
      const v = document.querySelector('#vid');
      v.muted = false;
      v.play().then(() => v.pause()).catch(() => {});
      document.querySelector('#hint').style.display = 'none';
    }, { once: true });
  </script>
  <style>
    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); color: #fff; padding: 10px 16px;
      font-family: sans-serif; border-radius: 6px; z-index: 9999;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <div id="hint">Touche l'écran puis vise le marqueur</div>

  <a-scene
    vr-mode-ui="enabled: false;"
    loading-screen="enabled: false;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    embedded
  >
    <a-assets>
      <!-- Vidéo Pexels renommée video.mp4 et placée dans assets/ -->
      <video id="vid" src="assets/video.mp4" preload="auto" loop
             crossorigin="anonymous" playsinline webkit-playsinline muted></video>
    </a-assets>

    <!-- Marqueur personnalisé généré avec le Marker Generator (fichier .patt) -->
    <a-marker type="pattern" preset="custom" url="assets/marker.patt" video-on-marker>
      <a-video src="#vid" width="1.6" height="0.9" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
